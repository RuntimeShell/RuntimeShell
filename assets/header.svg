<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Runtime — building ShellClient</title>
  <desc id="description">A dark, minimal profile banner with the Runtime name and ShellClient identity.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="0.55" stop-color="#090a0b"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8f8f6"/>
      <stop offset="1" stop-color="#8f9398"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <circle cx="1040" cy="76" r="210" fill="url(#halo)" filter="url(#soft)"/>
  <path d="M0 287C213 240 351 330 559 276C744 227 866 214 1200 274V360H0Z" fill="#ffffff" opacity=".022"/>
  <path d="M0 310C240 270 348 341 580 302C811 263 962 252 1200 291" fill="none" stroke="#fff" stroke-opacity=".055"/>

  <g transform="translate(72 72)">
    <rect width="78" height="78" rx="22" fill="#f4f4f1"/>
    <path d="M23 25h37L45 39h14L34 61H18l18-17H21Z" fill="#0a0b0c"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="72" y="205" fill="#f4f4f1" font-size="66" font-weight="700" letter-spacing="-3">Runtime</text>
    <text x="74" y="247" fill="#9a9da2" font-size="20" font-weight="500" letter-spacing=".25">BUILDING FAST, TRUSTWORTHY DESKTOP SOFTWARE.</text>
    <text x="74" y="302" fill="url(#signal)" font-size="17" font-weight="600">ShellClient</text>
    <text x="174" y="302" fill="#5e6268" font-size="17">/</text>
    <text x="196" y="302" fill="#a5a8ad" font-size="17">Rust · Tauri · Svelte · TypeScript</text>
  </g>

  <g transform="translate(1015 215)" fill="none" stroke="#d7d8d5" stroke-width="2">
    <path d="M0 37h34l12-12h48" opacity=".32"/>
    <circle cx="0" cy="37" r="4" fill="#f4f4f1" stroke="none"/>
    <circle cx="94" cy="25" r="4" fill="#f4f4f1" stroke="none"/>
  </g>
</svg>
